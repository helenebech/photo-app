<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editly</title>
    <link rel="stylesheet" href="style.css">

    <!-- endret (assistant): tillat bilder fra S3/CloudFront i CSP + fetch (connect-src) -->
    <meta http-equiv="Content-Security-Policy"
          content="
            default-src 'self';
            connect-src 'self' https://n12542407-photo-app.s3.ap-southeast-2.amazonaws.com;
            img-src 'self' data: https://*.amazonaws.com https://*.s3.amazonaws.com https://*.cloudfront.net;
            script-src 'self';
            style-src 'self' 'unsafe-inline';
          ">
    <!-- /endret (assistant) -->
  </head>

  <body>
    <!--Header and description-->
    <div class="top">
        <h1 style="text-align: center; ">Welcome to Editly!</h1>
        <h3 style="text-align: center;" >Here you can upload, edit and view your pictures</h3> 
    </div>

    <!--Upload pictures here-->
    <div id="section1">
        <h2> Upload your pictures here♥︎</h2>
        <input type="file" id="file" accept="image/*" />
        <button id="uploadBtn">Upload picture</button>
        <div id="lastUpload"></div>
    </div>

    <!--The gallery-->
    <div id="section2">
        <h2 style="text-align: center; margin-top: 20px;">⋆⭒˚.⋆ Gallery  ⋆⭒˚.⋆</h2>
        <div id="gallery"></div>
        <button id="refreshBtn">Update</button>
    </div>

    <!--Logout-->
    <div id="bottom">
        <button id="logoutBtn">Log out</button>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
